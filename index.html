<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Mapa com Imagens Movimentáveis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw Plugin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  </head>
  <body>
    <div id="container">
      <div id="map"></div>
      
      <!-- Text Labels outside the map -->
      <div id="top-label" class="text-label" contenteditable="true">Intervencionista</div>
      <div id="bottom-label" class="text-label" contenteditable="true">Liberal</div>
      <div id="left-label" class="text-label" contenteditable="true">Progressista</div>
      <div id="right-label" class="text-label" contenteditable="true">Conservador</div>
    </div>

    <!-- Sidebar para adicionar e armazenar imagens -->
    <div id="sidebar">
      <!-- Botão customizado para adicionar imagens -->
      <button id="add-image-btn">Adicionar Imagens</button>
      <input type="file" id="file-input" accept="image/*" multiple style="display: none;" />
      <div id="image-container"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
